<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mournyl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button id="loginBtn" class="login-btn" type="button" hidden>Log out</button>
    <h1 class="logo">mournyl</h1>
    <div class="controls">
      <div class="toggle">
        <button data-type="movie" class="active">Movies</button>
        <button data-type="tv">TV Shows</button>
        <button data-type="anime">Anime</button>
        <button data-type="server">My Server</button>
      </div>
      <input id="search" type="search" placeholder="Search movies…" autocomplete="off">
    </div>
    <nav id="lists"></nav>
  </header>

  <main>
      <section id="theaters" class="theaters" hidden>
      <h2>Theaters near you</h2>
      <form id="zipForm" class="zip-form">
        <input id="zip" inputmode="numeric" maxlength="5" placeholder="ZIP code" autocomplete="postal-code" aria-label="ZIP code">
        <select id="radius" aria-label="Distance">
          <option value="5">5 mi</option>
          <option value="10" selected>10 mi</option>
          <option value="25">25 mi</option>
        </select>
        <button type="submit">Find theaters</button>
      </form>
      <div id="theaterList" class="theater-list"></div>
    </section>
    <div id="grid" class="grid"></div>
    <div id="sentinel"></div>
    <p id="status"></p>
  </main>

  <dialog id="detail">
    <button class="close" aria-label="Close">&times;</button>
    <div id="detailBody"></div>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/library.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
